<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />

    <style>
      /* ============================================
           RESET & VARIABLES
           ============================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --navy: #0a2540;
        --navy-light: #1a3a5c;
        --maroon: #9e2a2b;
        --maroon-hover: #b13e3f;
        --blue-card: #1f6392;
        --green: #1e6f3f;
        --gold: #fbbf24;
        --sidebar-w: 280px;
        --topnav-h: 64px;
        --font: "Inter", "Segoe UI", sans-serif;
        --text: #1e293b;
        --text-muted: #5a6874;
        --border: #e9edf2;
        --bg: #f1f5f9;
        --white: #ffffff;
        --radius: 14px;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
        --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.06);
        --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.15);
        --transition: 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
      }

      /* ============================================
           SIDEBAR
           ============================================ */
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        width: var(--sidebar-w);
        background: linear-gradient(180deg, #0a2b3e 0%, #07212f 100%);
        color: #eef2ff;
        display: flex;
        flex-direction: column;
        z-index: 100;
        transition: transform 0.3s ease;
        overflow-x: hidden;
        overflow-y: auto;
        box-shadow: 4px 0 20px rgba(0, 0, 0, 0.08);
      }
      .sidebar::-webkit-scrollbar {
        width: 4px;
      }
      .sidebar::-webkit-scrollbar-track {
        background: transparent;
      }
      .sidebar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.15);
        border-radius: 10px;
      }

      .sidebar__brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 1.2rem 1.2rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        flex-shrink: 0;
        min-height: var(--topnav-h);
      }
      .sidebar__brand-icon {
        font-size: 1.6rem;
        flex-shrink: 0;
      }
      .sidebar__brand-text {
        font-weight: 800;
        font-size: 1.1rem;
        background: linear-gradient(120deg, #fff, #c0d9f0);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        white-space: nowrap;
      }

      .sidebar__nav {
        flex: 1;
        padding: 0.6rem 0.6rem;
        overflow-y: auto;
      }
      .sidebar__item {
        margin-bottom: 2px;
      }

      .sidebar__link,
      .sidebar__link--toggle {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.5rem 0.9rem;
        border-radius: 10px;
        color: rgba(255, 255, 255, 0.78);
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 500;
        transition: all 0.2s;
        cursor: pointer;
        white-space: nowrap;
        border: none;
        background: transparent;
        width: 100%;
        font-family: inherit;
        text-align: left;
      }
      .sidebar__link:hover,
      .sidebar__link--toggle:hover {
        background: rgba(255, 255, 255, 0.08);
        color: white;
      }
      .sidebar__link.active,
      .sidebar__link--toggle.active {
        background: var(--maroon);
        color: white;
        box-shadow: 0 4px 12px rgba(158, 42, 43, 0.25);
      }
      .sidebar__link i,
      .sidebar__link--toggle i {
        width: 20px;
        text-align: center;
        font-size: 0.95rem;
        flex-shrink: 0;
      }
      .sidebar__chevron {
        margin-left: auto;
        transition: transform 0.2s;
        font-size: 0.7rem;
      }
      .sidebar__item--open .sidebar__chevron {
        transform: rotate(180deg);
      }

      .sidebar__submenu {
        list-style: none;
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.3s ease;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        margin: 0 0.5rem 0 0.5rem;
      }
      .sidebar__submenu--open {
        max-height: 600px;
      }
      .sidebar__sublink {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0.4rem 0.9rem 0.4rem 2.8rem;
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        font-size: 0.76rem;
        font-weight: 400;
        transition: 0.2s;
        border-radius: 6px;
        cursor: pointer;
        background: transparent;
        border: none;
        width: 100%;
        text-align: left;
        font-family: inherit;
      }
      .sidebar__sublink:hover {
        background: rgba(255, 255, 255, 0.06);
        color: white;
      }
      .sidebar__sublink.active {
        color: white;
        background: rgba(255, 255, 255, 0.1);
      }
      .sidebar__sublink .badge {
        margin-left: auto;
        background: var(--maroon);
        color: white;
        font-size: 0.55rem;
        padding: 0.1rem 0.5rem;
        border-radius: 30px;
        font-weight: 600;
      }

      .sidebar__footer {
        padding: 1rem 1.2rem;
        font-size: 0.62rem;
        color: rgba(255, 255, 255, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        text-align: center;
        flex-shrink: 0;
      }

      /* ============================================
           MOBILE OVERLAY
           ============================================ */
      .sidebar-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 90;
        opacity: 0;
        visibility: hidden;
        transition: 0.2s;
      }
      .sidebar-overlay.active {
        opacity: 1;
        visibility: visible;
      }

      /* ============================================
           MAIN CONTENT
           ============================================ */
      .main-content {
        margin-left: var(--sidebar-w);
        flex: 1;
        min-height: 100vh;
        transition: margin-left 0.3s ease;
        padding: 1.8rem 2rem 2rem;
        background: var(--bg);
      }

      /* ============================================
           TOP BAR
           ============================================ */
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 1rem;
      }
      .topbar__left {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
      }
      .topbar__hamburger {
        display: none;
        background: none;
        border: none;
        font-size: 1.4rem;
        color: var(--navy);
        cursor: pointer;
        padding: 0.3rem;
      }
      .topbar__title {
        font-size: 1.6rem;
        font-weight: 800;
        display: flex;
        align-items: center;
        gap: 0.6rem;
      }
      .topbar__badge {
        background: var(--navy);
        color: white;
        padding: 0.2rem 0.9rem;
        border-radius: 40px;
        font-size: 0.7rem;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }
      .topbar__actions {
        display: flex;
        gap: 0.6rem;
        flex-wrap: wrap;
      }

      .btn {
        padding: 0.35rem 1rem;
        border: none;
        border-radius: 40px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        font-size: 0.75rem;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        font-family: inherit;
      }
      .btn-primary {
        background: var(--navy);
        color: white;
      }
      .btn-primary:hover {
        background: var(--navy-light);
      }
      .btn-success {
        background: var(--green);
        color: white;
      }
      .btn-success:hover {
        background: #14532d;
      }
      .btn-outline {
        background: transparent;
        border: 1px solid var(--border);
        color: var(--text);
      }
      .btn-outline:hover {
        background: var(--bg);
      }
      .btn-sm {
        padding: 0.2rem 0.7rem;
        font-size: 0.65rem;
        border-radius: 30px;
        border: 1px solid var(--border);
        background: var(--white);
        cursor: pointer;
        transition: 0.2s;
        font-family: inherit;
        font-weight: 500;
        color: var(--text);
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.3rem;
      }
      .btn-sm:hover {
        background: var(--bg);
        border-color: #cbd5e1;
      }
      .btn-sm.primary {
        background: var(--navy);
        color: white;
        border-color: var(--navy);
      }
      .btn-sm.primary:hover {
        background: var(--navy-light);
      }

      /* ============================================
           WEEK NAVIGATION
           ============================================ */
      .week-nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--white);
        padding: 0.6rem 1.5rem;
        border-radius: var(--radius);
        border: 1px solid var(--border);
        box-shadow: var(--shadow);
        margin-bottom: 1.5rem;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .week-nav__controls {
        display: flex;
        align-items: center;
        gap: 0.8rem;
      }
      .week-nav__controls button {
        background: none;
        border: 1px solid var(--border);
        border-radius: 30px;
        padding: 0.3rem 0.8rem;
        cursor: pointer;
        font-family: var(--font);
        font-size: 0.7rem;
        font-weight: 500;
        color: var(--text);
        transition: 0.2s;
      }
      .week-nav__controls button:hover {
        background: var(--bg);
        border-color: #cbd5e1;
      }
      .week-nav__controls button.primary {
        background: var(--navy);
        color: white;
        border-color: var(--navy);
      }
      .week-nav__controls button.primary:hover {
        background: var(--navy-light);
      }
      .week-nav__date {
        font-weight: 600;
        font-size: 0.85rem;
        color: var(--text);
      }
      .week-nav__today {
        font-size: 0.7rem;
        color: var(--text-muted);
        background: var(--bg);
        padding: 0.2rem 0.8rem;
        border-radius: 30px;
      }

      /* ============================================
           TIMETABLE GRID
           ============================================ */
      .timetable-wrapper {
        background: var(--white);
        border-radius: var(--radius);
        border: 1px solid var(--border);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .timetable-scroll {
        overflow-x: auto;
        padding: 0 0.5rem 0.5rem 0.5rem;
      }
      .timetable-grid {
        width: 100%;
        border-collapse: collapse;
        min-width: 700px;
        table-layout: fixed;
      }
      .timetable-grid th {
        padding: 0.8rem 0.5rem;
        text-align: center;
        font-weight: 700;
        font-size: 0.7rem;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        color: var(--text-muted);
        border-bottom: 2px solid var(--border);
        background: var(--bg);
      }
      .timetable-grid th:first-child {
        width: 80px;
        min-width: 80px;
      }
      .timetable-grid td {
        padding: 0.3rem;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
        vertical-align: top;
        height: 72px;
        min-height: 72px;
        position: relative;
      }
      .timetable-grid td:last-child {
        border-right: none;
      }
      .timetable-grid tr:last-child td {
        border-bottom: none;
      }
      .timetable-grid .time-label {
        text-align: center;
        font-weight: 600;
        font-size: 0.7rem;
        color: var(--text-muted);
        padding: 0.3rem 0.2rem;
        background: var(--bg);
        border-right: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        height: 72px;
        min-height: 72px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        line-height: 1.3;
      }
      .timetable-grid .time-label .ampm {
        font-size: 0.55rem;
        font-weight: 400;
        color: var(--text-muted);
      }
      .timetable-grid .time-label:last-child {
        border-bottom: none;
      }
      .timetable-grid td.today {
        background: #f8fafc;
      }

      /* ===== Course Block ===== */
      .course-block {
        background: #eef2ff;
        border-radius: 8px;
        padding: 0.4rem 0.5rem;
        height: 100%;
        min-height: 62px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-left: 4px solid var(--navy);
        cursor: pointer;
        transition: 0.2s;
      }
      .course-block:hover {
        transform: scale(1.02);
        box-shadow: var(--shadow-md);
      }
      .course-block .code {
        font-weight: 700;
        font-size: 0.7rem;
        color: var(--navy);
      }
      .course-block .title {
        font-size: 0.65rem;
        font-weight: 500;
        color: var(--text);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .course-block .meta {
        font-size: 0.55rem;
        color: var(--text-muted);
        display: flex;
        align-items: center;
        gap: 0.3rem;
        margin-top: 0.1rem;
        flex-wrap: wrap;
      }
      .course-block .meta i {
        font-size: 0.5rem;
      }
      .course-block .tag {
        font-size: 0.5rem;
        font-weight: 700;
        padding: 0.05rem 0.4rem;
        border-radius: 30px;
        background: rgba(10, 37, 64, 0.1);
        color: var(--navy);
        display: inline-block;
        margin-top: 0.1rem;
        align-self: flex-start;
      }
      .course-block .tag.invig {
        background: #fef3c7;
        color: #92400e;
      }
      .course-block .tag.exam {
        background: #fce4ec;
        color: #9e2a2b;
      }

      /* Color variants */
      .course-block.color-1 {
        border-left-color: #1f6392;
        background: #e8f0fe;
      }
      .course-block.color-2 {
        border-left-color: #1e6f3f;
        background: #e6f4ea;
      }
      .course-block.color-3 {
        border-left-color: #9e2a2b;
        background: #fce8e8;
      }
      .course-block.color-4 {
        border-left-color: #b45309;
        background: #fef3c7;
      }
      .course-block.color-5 {
        border-left-color: #6b21a8;
        background: #f3e8ff;
      }

      .course-block .code {
        font-weight: 700;
        font-size: 0.7rem;
        color: var(--navy);
      }

      /* ============================================
           EMPTY STATE
           ============================================ */
      .empty-cell {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        min-height: 62px;
        color: var(--text-muted);
        font-size: 0.6rem;
        opacity: 0.4;
      }

      /* ============================================
           TOAST
           ============================================ */
      .toast {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        background: var(--navy);
        color: white;
        padding: 0.7rem 1.3rem;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        opacity: 0;
        transform: translateY(20px);
        transition: 0.3s;
        z-index: 2000;
        font-size: 0.85rem;
        font-family: var(--font);
      }
      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }
      .toast.success {
        background: var(--green);
      }
      .toast.warning {
        background: #92400e;
      }
      .toast.info {
        background: var(--navy);
      }

      /* ============================================
           RESPONSIVE
           ============================================ */
      @media (max-width: 1024px) {
        .timetable-grid {
          min-width: 600px;
        }
      }
      @media (max-width: 768px) {
        .topbar__hamburger {
          display: block;
        }
        .sidebar {
          transform: translateX(-100%);
          transition: transform 0.3s ease;
          width: var(--sidebar-w) !important;
        }
        .sidebar.open {
          transform: translateX(0);
        }
        .main-content {
          margin-left: 0 !important;
          padding: 1rem;
        }
        .topbar__title {
          font-size: 1.2rem;
        }
        .sidebar-overlay.active {
          opacity: 1;
          visibility: visible;
        }
        .week-nav {
          flex-direction: column;
          align-items: stretch;
          text-align: center;
        }
        .week-nav__controls {
          justify-content: center;
          flex-wrap: wrap;
        }
        .timetable-grid {
          min-width: 500px;
          font-size: 0.7rem;
        }
        .timetable-grid th {
          font-size: 0.6rem;
          padding: 0.5rem 0.2rem;
        }
        .timetable-grid td {
          height: 56px;
          min-height: 56px;
          padding: 0.15rem;
        }
        .timetable-grid .time-label {
          height: 56px;
          min-height: 56px;
          font-size: 0.6rem;
        }
        .course-block {
          min-height: 48px;
          padding: 0.2rem 0.3rem;
        }
        .course-block .code {
          font-size: 0.6rem;
        }
        .course-block .title {
          font-size: 0.55rem;
        }
        .course-block .meta {
          font-size: 0.5rem;
        }
        .course-block .tag {
          font-size: 0.45rem;
          padding: 0.05rem 0.3rem;
        }
        .empty-cell {
          min-height: 48px;
          font-size: 0.5rem;
        }
      }
      @media (max-width: 480px) {
        .topbar__actions {
          width: 100%;
        }
        .topbar__actions .btn {
          flex: 1;
          justify-content: center;
        }
        .timetable-grid {
          min-width: 400px;
          font-size: 0.6rem;
        }
        .timetable-grid th {
          font-size: 0.5rem;
          padding: 0.3rem 0.1rem;
        }
        .timetable-grid td {
          height: 44px;
          min-height: 44px;
          padding: 0.1rem;
        }
        .timetable-grid .time-label {
          height: 44px;
          min-height: 44px;
          font-size: 0.5rem;
        }
        .course-block {
          min-height: 38px;
          padding: 0.15rem 0.2rem;
          border-left-width: 3px;
        }
        .course-block .code {
          font-size: 0.5rem;
        }
        .course-block .title {
          font-size: 0.45rem;
        }
        .course-block .meta {
          font-size: 0.4rem;
          gap: 0.15rem;
        }
        .course-block .meta i {
          font-size: 0.4rem;
        }
        .course-block .tag {
          font-size: 0.4rem;
          padding: 0.05rem 0.2rem;
        }
        .empty-cell {
          min-height: 38px;
          font-size: 0.4rem;
        }
      }
    </style>

    {% block head %} {% endblock head %}
  </head>
  <body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <aside class="sidebar" id="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__brand-icon">🎓</span>
        <span class="sidebar__brand-text">Naet</span>
      </div>
      <nav class="sidebar__nav">
        <ul class="sidebar__menu">
          <li class="sidebar__item">
            <a href="{% url 'lecturer-dashboard' %}" class="sidebar__link">
              <i class="fas fa-tachometer-alt"></i><span>Dashboard</span>
            </a>
          </li>

          <li class="sidebar__item sidebar__item--group">
            <button class="sidebar__link--toggle" data-target="teaching-sub">
              <i class="fas fa-chalkboard-teacher"></i><span>My Teaching</span>
              <i class="fas fa-chevron-down sidebar__chevron"></i>
            </button>
            <ul class="sidebar__submenu" id="teaching-sub">
              <li>
                <a href="{% url 'lecturer-courses' %}" class="sidebar__sublink"
                  >My Courses</a
                >
              </li>
              <li>
                <a
                  href="{% url 'lecturer-class-list' %}"
                  class="sidebar__sublink"
                  >Class Lists</a
                >
              </li>
              <li>
                <a
                  href="{% url 'lecturer-timetable' %}"
                  class="sidebar__sublink"
                  >My Timetable</a
                >
              </li>
            </ul>
          </li>

          <li class="sidebar__item sidebar__item--group">
            <button class="sidebar__link--toggle" data-target="assessment-sub">
              <i class="fas fa-clipboard-list"></i><span>Assessment</span>
              <i class="fas fa-chevron-down sidebar__chevron"></i>
            </button>
            <ul class="sidebar__submenu" id="assessment-sub">
              <li>
                <a
                  href="{% url 'lecturer-enter-results' %}"
                  class="sidebar__sublink"
                >
                  Enter Results {% if stats.pending %}<span class="badge"
                    >{{ stats.pending }}</span
                  >{% endif %}
                </a>
              </li>
              <li>
                <a
                  href="{% url 'lecturer-invigilation' %}"
                  class="sidebar__sublink"
                  >Invigilation Duties</a
                >
              </li>
            </ul>
          </li>

          <li class="sidebar__item sidebar__item--group">
            <button class="sidebar__link--toggle" data-target="profile-sub">
              <i class="fas fa-id-badge"></i><span>My Profile</span>
              <i class="fas fa-chevron-down sidebar__chevron"></i>
            </button>
            <ul class="sidebar__submenu" id="profile-sub">
              <li>
                <a
                  href="{% url 'lecturer-profile-details' %}"
                  class="sidebar__sublink"
                  >Profile Details</a
                >
              </li>
            </ul>
          </li>
        </ul>
      </nav>
      <div class="sidebar__footer">© {% now "Y" %} Naet</div>
    </aside>

    <main class="main-content" id="mainContent">
      {% block content %} {% endblock content %}
    </main>
    <script>
      // ── sidebar ───────────────────────────────────────────────────────────────
      document.querySelectorAll(".sidebar__link--toggle").forEach((btn) => {
        btn.addEventListener("click", function (e) {
          e.preventDefault();
          const sub = document.getElementById(this.dataset.target);
          const item = this.closest(".sidebar__item--group");
          if (!sub) return;
          sub.classList.toggle("sidebar__submenu--open");
          item.classList.toggle("sidebar__item--open");
          this.setAttribute(
            "aria-expanded",
            sub.classList.contains("sidebar__submenu--open"),
          );
        });
      });
      const hamburgerBtn = document.getElementById("hamburgerBtn");
      const sidebar = document.getElementById("sidebar");
      const overlay = document.getElementById("sidebarOverlay");
      hamburgerBtn?.addEventListener("click", () => {
        sidebar.classList.toggle("open");
        overlay?.classList.toggle("active");
      });
      overlay?.addEventListener("click", () => {
        sidebar.classList.remove("open");
        overlay.classList.remove("active");
      });
      window.addEventListener("resize", () => {
        if (window.innerWidth > 768) {
          sidebar.classList.remove("open");
          overlay?.classList.remove("active");
        }
      });

      // ── toast ─────────────────────────────────────────────────────────────────
      function showToast(msg, type = "info") {
        const t = document.getElementById("toast");
        if (!t) return;
        t.textContent = msg;
        t.className = `toast ${type} show`;
        clearTimeout(t._t);
        t._t = setTimeout(() => t.classList.remove("show"), 3500);
      }
    </script>
  </body>
</html>
